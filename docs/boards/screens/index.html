<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIVE 시연 화면 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --bg: #E9E7E2; --paper: #FFFFFF; --ink: #1B1B1F; --ink-2: #5A5A63; --line: #C9C6BF;
  --a-image: #3B82F6; --a-caption: #0EA5A4; --a-nav: #F59E0B; --a-spot: #E11D8F; --a-map: #8B5CF6; --a-cover: #16A34A; --a-dim: #DC2626;
  --wf-bg: #F4F4F2; --wf-box: #D6D4CF; --wf-ink: #44444C;
  --fs-s: 12px; --fs-m: 14px; --fs-l: 18px; --fs-xl: 24px;
  --r: 8px; --gap: 24px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Pretendard, system-ui, sans-serif; font-size: var(--fs-m); line-height: 1.5; }
header { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
header h1 { font-size: var(--fs-l); margin: 0 8px 0 0; letter-spacing: -0.02em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; font: inherit; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); cursor: pointer; }
main { padding: 24px; }
section { margin-bottom: 40px; }
h2 { font-size: var(--fs-xl); letter-spacing: -0.02em; margin: 0 0 4px; }
.lead { color: var(--ink-2); margin: 0 0 16px; }
/* 흐름도 */
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.flow a { text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--wf-bg); white-space: nowrap; }
.flow a:hover { border-color: var(--ink); }
.flow .arr { color: var(--ink-2); }
.flow .end { border-style: dashed; color: var(--ink-2); }
/* 장면 줄 */
.row { display: flex; gap: var(--gap); overflow-x: auto; padding: 8px 4px 16px; scroll-snap-type: x proximity; }
.card { flex: 0 0 auto; width: calc(402px + 20px); scroll-snap-align: start; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.card h3 { font-size: var(--fs-m); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
.card h3 span { color: var(--ink-2); font-weight: 400; }
.phone { position: relative; width: 402px; height: 874px; overflow: hidden; border-radius: 6px; background: #030303; }
.phone img.shot { width: 402px; height: 874px; display: block; }
.ann { position: absolute; inset: 0; pointer-events: none; }
.box { position: absolute; border: 1.5px solid var(--c); }
.box.ell { border-radius: 50%; border-style: dashed; }
.tag { position: absolute; background: var(--c); color: #fff; font-size: 11px; line-height: 1.3; padding: 1px 5px; border-radius: 3px; white-space: nowrap; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
.dim { position: absolute; border-color: var(--a-dim); }
.dim.v { border-left: 1px dashed var(--a-dim); }
.dim.h { border-top: 1px dashed var(--a-dim); }
.dim b { position: absolute; font-size: 11px; color: #fff; background: var(--a-dim); padding: 0 4px; border-radius: 3px; font-weight: 600; white-space: nowrap; }
body:not(.show-ann) .ann { display: none; }
body:not(.show-dim) .dim { display: none; }
/* 와이어프레임 모드 */
body.wf .phone { background: var(--wf-bg); }
/* (11/2) 아이폰 화면 요소 (애플 디자인 템플릿 기준, 402×874pt): 상태 표시줄 62pt · 다이내믹 아일랜드 · 홈 인디케이터 34pt */
.ios { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
body:not(.show-ios) .ios { display: none; }
.ios .zone-t { position: absolute; left: 0; right: 0; top: 0; height: 62px; border-bottom: 1px dashed rgba(255,90,90,.9); }
.ios .zone-b { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; border-top: 1px dashed rgba(90,160,255,.9); }
.ios .island { position: absolute; top: 14px; left: 50%; width: 95px; height: 36px; margin-left: -47.5px; background: #000; border-radius: 18px; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.ios .time { position: absolute; top: 22px; left: 15.4%; color: #fff; font: 600 16px/20px -apple-system, 'Pretendard', sans-serif; }
.ios .icons { position: absolute; top: 25px; right: 9.5%; display: flex; gap: 5px; align-items: center; }
.ios .icons i { display: block; background: #fff; border-radius: 2px; }
.ios .icons i:nth-child(1) { width: 17px; height: 11px; } .ios .icons i:nth-child(2) { width: 15px; height: 11px; border-radius: 50% 50% 2px 2px; } .ios .icons i:nth-child(3) { width: 25px; height: 12px; border-radius: 4px; }
.ios .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; background: #fff; border-radius: 3px; }
body.wf .ios .time { color: var(--wf-ink); } body.wf .ios .icons i, body.wf .ios .home { background: var(--wf-ink); }
.ios .zone-t b, .ios .zone-b b { position: absolute; right: 4px; font-size: 10px; color: #fff; background: rgba(0,0,0,.55); padding: 0 4px; border-radius: 3px; font-weight: 600; }
.ios .zone-t b { bottom: 2px; } .ios .zone-b b { top: 2px; }
body:not(.show-dim) .ios b { display: none; }
body.wf img.shot { display: none; }
body.wf .wf-layer { display: block; }
.wf-layer { display: none; position: absolute; inset: 0; }
.wf-img { position: absolute; background: repeating-linear-gradient(45deg, var(--wf-box) 0 6px, #E2E0DB 6px 12px); border: 1px solid #A9A69F; }
.wf-el { position: absolute; border: 1.5px solid var(--wf-ink); border-radius: 4px; background: rgba(255,255,255,.85); color: var(--wf-ink); font-size: 11px; padding: 2px 4px; overflow: hidden; }
.wf-el.btn-fill { background: var(--wf-ink); color: #fff; border-radius: 10px; display: grid; place-items: center; }
.wf-el.text { border-style: dotted; }
.wf-ell { position: absolute; border: 2px dashed var(--a-spot); border-radius: 50%; }
.wf-dimout { position: absolute; inset: 0; background: rgba(0,0,0,.08); }
/* 장면 설명 */
.meta { margin-top: 8px; font-size: var(--fs-s); color: var(--ink-2); }
.meta p { margin: 0 0 6px; color: var(--ink); font-size: var(--fs-m); }
.meta dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 0; }
.meta dt { color: var(--ink-2); }
.meta dd { margin: 0; color: var(--ink); }
.flag { display: inline-block; margin-top: 6px; background: #FEF3C7; color: #92400E; border-radius: 4px; padding: 2px 6px; }
/* 디자인 값 표 */
.spec { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.spec .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.spec h4 { margin: 0 0 8px; font-size: var(--fs-m); }
.spec table { width: 100%; border-collapse: collapse; font-size: var(--fs-s); }
.spec td { padding: 4px 0; border-top: 1px solid #EEE; vertical-align: top; }
.spec td:first-child { color: var(--ink-2); width: 42%; padding-right: 8px; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid #999; vertical-align: -2px; margin-right: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: var(--fs-s); color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 4px; vertical-align: -1px; }
@media (max-width: 480px) { main { padding: 12px; } header { padding: 10px 12px; } }
</style>
</head>
